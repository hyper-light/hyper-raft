name: ci

on:
  push:

jobs:
  depth:
    # Diagnostic only, never merged. docs/durable.md §14 item 1 on Linux: hyper-durable's depth
    # bench, one group and many on their members' logs, on the runners' own disks, each runner's
    # device described first (its write cache and FUA, which decide whether a confirmation is a
    # durable write without a flush of the device's cache).
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 124
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: |
          uname -a; nproc; free -g; df -h "$RUNNER_TEMP" /tmp
          findmnt -T "$RUNNER_TEMP"
          for d in /sys/block/*; do
            [ -e "$d/queue/write_cache" ] || continue
            echo "$d: cache $(cat $d/queue/write_cache) fua $(cat $d/queue/fua 2>/dev/null) rotational $(cat $d/queue/rotational) model $(cat $d/device/model 2>/dev/null)"
          done
        shell: bash
      - run: cargo bench -p hyper-durable --bench depth --locked --no-run
        shell: bash
      - run: |
          mkdir -p "$RUNNER_TEMP/depth"
          uptime
          cargo bench -p hyper-durable --bench depth --locked -- "$RUNNER_TEMP/depth" 1,4,16,64 25,50,75,90 3 file,sim
          cargo bench -p hyper-durable --bench depth --locked -- "$RUNNER_TEMP/depth" 1,4 25,50,75,90 3 file 1230 16,256
        shell: bash
