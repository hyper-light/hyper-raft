\* The scenario with the core's release and votes, and slates' ballot rule
\* in place of the most held: of the reports said in the latest term, the
\* value |Q| + |F| - n of them hold, else the index is free. A member here
\* says again what it holds when it votes in a later term (Elect, Say), so
\* a report's term is the last it was said in: B's word of Early, said
\* again in a term-2 election that elected no one, outranks C's of term 1,
\* one report short of the |Q| + |F| - n = 2 the rule asks, and D, elected
\* by B and C, finds an index the fast quorum committed free.
INIT TermOneHeld
NEXT Next
VIEW ScenarioView
CONSTANTS
  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3, s4}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1, v2}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 3
  MaxLen = 3
  Rule = "ballot"
  HeldAt = {2, 3}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- ScenarioLeads
  Proposed <- ScenarioProposals
  A = s1
  B = s2
  C = s3
  D = s4
  Early = v1
  Late = v2
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 495
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
