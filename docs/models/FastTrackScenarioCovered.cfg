\* The scenario with the release on log coverage alone (slates'
\* DropCovered): A and B let go of Early at 3 once their logs reach it.
\* A, whose holding counted toward the fast quorum, let go of it when it
\* took Early into its log, so term 1 ends as TermOneLogs states it.
INIT TermOneLogs
NEXT Next
VIEW ScenarioView
CONSTANTS
  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3, s4}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1, v2}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 3
  MaxLen = 3
  Rule = "most"
  HeldAt = {2, 3}
  Losers = {}
  Releases = "log"
  Votes = "held"
  Reports = "held"
  Leads <- ScenarioLeads
  Proposed <- ScenarioProposals
  A = s1
  B = s2
  C = s3
  D = s4
  Early = v1
  Late = v2
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 2549
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
