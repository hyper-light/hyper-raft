\* Marked with voters judging by their logs alone: the checker must find a
\* leader that lacks what was committed. s1 commits an entry by s2; s2 loses
\* it at rest and votes for s3, whose log is empty, by its own empty log.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Initial = {s1, s2, s3}
  Target = {s1, s2, s3}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 1
  Rule = "most"
  HeldAt = {}
  Losers = {s1, s2, s3}
  Marks = "whole"
  Counts = "round"
  Configs = "term"
  \* A ceiling until CI counts it (docs/models/README.md): the scope focal measured past
  \* twenty million states is not run here.
  StateBudget = 20000000
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
