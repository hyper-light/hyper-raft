\* Suspicion.cfg at two terms with a pre-candidate that asks on when its
\* detectors leave it no quorum. The checker must refuse it, finding a
\* pre-candidate that drops its leader's messages and could win only by the
\* vote of a member it suspects.
SPECIFICATION Spec
CONSTANTS
  Servers = {a, b, c}
  Stopped = {c}
  Nobody = Nobody
  MaxTerm = 2
  Rule = "asking"
  CheckStable = TRUE
  StateBudget = 35
INVARIANTS
  WithinBudget
  TypeOK
  OneLeader
  Stable
  AskingCanWin
