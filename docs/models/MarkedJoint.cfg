\* Marked members across a joint configuration that removes s3
\* (ConfChangeV2 with auto-leave): two terms, two indexes, the entry that
\* enters it and the one that leaves it, any member losing the tail of its log
\* at rest. A marked candidate counts both halves' majorities without itself:
\* of the halves' two and three voters no member of the half of two can be,
\* and s3 needs the other two to vouch for its log. A marked member is
\* elected under the three voters before the change (MarkedJointReached.cfg),
\* which the change then passes through.
