\* FastTrackGrow.cfg with the claim that no index is committed by what
\* members hold by themselves after a change: the checker must find one
\* that is, or FastTrackGrow.cfg checks nothing of the second rule.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 2
  Rule = "most"
  HeldAt = {2}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 10000000
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
  NoFastByHeldAfterChange
