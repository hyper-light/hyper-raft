\* SuspicionStop.cfg where a remaining voter that took the announcement only
\* suspects the stopping voter, and takes what it sends as any other's. The
\* checker must refuse it, finding the stopping voter's forced campaign, or a
\* later term it reached, take the leader from the group it left, or
\* Raft::stopped's drops are checked by nothing.
SPECIFICATION Spec
CONSTANTS
  Servers = {a, b, c}
  Stopped = {}
  Leaving = {c}
  Announced = TRUE
  Nobody = Nobody
  MaxTerm = 2
  Rule = "nodrop"
  CheckStable = TRUE
  StateBudget = 347255
INVARIANTS
  WithinBudget
  TypeOK
  OneLeader
  Stable
  AskingCanWin
