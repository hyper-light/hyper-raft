\* Swarm fast seed 41,345's scenario (FastTrackScenario.tla) with the
\* core's rules: a member holds what it holds by itself until it knows the
\* index committed by a classic quorum, and a fast quorum counts only such
\* holdings. Every run from the end of term 1 keeps every invariant; the
\* count is hyper-check's for the same search (tests/fasttrack.rs).
INIT TermOneHeld
NEXT Next
VIEW ScenarioView
CONSTANTS
  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3, s4}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1, v2}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 3
  MaxLen = 3
  Rule = "most"
  HeldAt = {2, 3}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- ScenarioLeads
  Proposed <- ScenarioProposals
  A = s1
  B = s2
  C = s3
  D = s4
  Early = v1
  Late = v2
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 3870308
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
