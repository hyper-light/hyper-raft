\* SuspicionStop.cfg with the stop detected only as a silence, by the
\* remaining voters' detectors at some time after it, and Stable claimed
\* from the stop on. The checker must refuse it, finding a remaining voter
\* that still trusts the stopped voter ask for votes at a wrong suspicion of
\* the leader (the window an announcement closes), or the announcement is
\* checked by nothing.
SPECIFICATION Spec
CONSTANTS
  Servers = {a, b, c}
  Stopped = {}
  Leaving = {c}
  Announced = FALSE
  Nobody = Nobody
  MaxTerm = 2
  Rule = "core"
  CheckStable = TRUE
  StateBudget = 25976
INVARIANTS
  WithinBudget
  TypeOK
  OneLeader
  Stable
  AskingCanWin
