\* Three voters, of which a change removes s3, and a fast quorum counted by
\* the voters in force alone, without those the leader was elected under:
\* the checker must find that a leader then lacks what was committed. The
\* leader of term 1 writes the change and commits it by s2, which does not
\* hear that it is committed and counts by all three; the leader commits the
\* next index by the fast quorum of the two, s2 holding the entry beside its
\* log; s3 holds another entry there, and s2 is elected by s3 and takes it
\* (seed 54104, crates/hyper-raft/tests/fast.rs, three voters for five).
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Initial = {s1, s2, s3}
  Target = {s1, s2}
  Joint = FALSE
  Values = {v1, v2}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 2
  Rule = "most"
  HeldAt = {2}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 4067274
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
