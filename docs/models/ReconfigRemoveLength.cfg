\* ReconfigRemove.cfg by raft-rs's precedence of length: the checker must
\* refuse it, finding a state where A, of the longest log and an older term,
\* refuses every candidate for priority and can never be elected itself, as
\* in swarm group seed 9,657; or Elects checks nothing of the precedence.
SPECIFICATION Spec
CONSTANTS
  Servers = {a, b, c}
  A = a
  B = b
  C = c
  D = d
  Values = {}
  Noop = Noop
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 3
  Elections = "newest"
  Commits = "newest"
  Stand = "needed"
  Ranking = "ac"
  Precedence = "length"
  Scenario = "remove"
  StateBudget = 848
INVARIANTS
  WithinBudget
  TypeOK
  OneLeader
  Agreement
  Committed
  LeaderHolds
  LogMatching
  Elects
