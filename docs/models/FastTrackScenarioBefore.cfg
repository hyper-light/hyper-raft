\* The scenario with the rules the core had before the fix: a member
\* lets go of what it holds once its log reaches the index, and a fast
\* quorum counts what members hold from the leader. D is elected in term 3
\* by A and C and takes Late at index 3, committed with Early in term 1.
INIT TermOneLogs
NEXT Next
VIEW ScenarioView
CONSTANTS
  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3, s4}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1, v2}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 3
  MaxLen = 3
  Rule = "most"
  HeldAt = {2, 3}
  Losers = {}
  Releases = "log"
  Votes = "logs"
  Reports = "held"
  Leads <- ScenarioLeads
  Proposed <- ScenarioProposals
  A = s1
  B = s2
  C = s3
  D = s4
  Early = v1
  Late = v2
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 2549
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
