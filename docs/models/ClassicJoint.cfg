\* The classic core alone, with a change that replaces s1 by s3 through a
\* joint configuration (ConfChangeV2 with auto-leave): two terms, three
\* indexes, the entry that enters it, the one that leaves it, and one more.
\* What is committed every later leader holds, across both.
