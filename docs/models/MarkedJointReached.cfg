\* MarkedJoint.cfg and the claim NoMarkedLeader: the checker must find a
\* member elected while marked.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Initial = {s1, s2, s3}
  Target = {s1, s2}
  Joint = TRUE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 2
  Rule = "most"
  HeldAt = {}
  Losers = {s1, s2, s3}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 10000000
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
  NoMarkedLeader
