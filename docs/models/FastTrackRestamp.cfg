\* Three voters, two terms, three indexes, one value beside the leader's own,
\* held at index 2: a leader of term 1 commits index 2 by what members hold,
\* the leader of term 2, whose log ends at 1, takes it again under its own
\* term, and a member that committed it in term 1 keeps that stamp and
\* takes index 3 from the new leader (FastTrackRestampReached.cfg shows the
\* pair is reached).  LogMatching holds with terms compared only where
\* neither member has committed.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Initial = {s1, s2, s3}
  Target = {s1, s2, s3}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 3
  Rule = "most"
  HeldAt = {2}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 3808625
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
