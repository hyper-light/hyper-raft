  Joint = TRUE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 2
  Rule = "most"
  HeldAt = {}
  Losers = {s1, s2, s3}
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 909876
SYMMETRY Alike
INVARIANTS
  WithinBudget
