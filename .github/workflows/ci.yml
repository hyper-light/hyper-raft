name: ci

on:
  push:

jobs:
  e2e-soak:
    # Diagnostic only, never merged. STATUS's two open E2E sightings, hyper-raft-e2e's
    # stalled-devices and hyper-durable-e2e's kill member-stopped, run in turn until the deadline
    # or the first failure on every target, on the harness of 3363c72 (a write the members up can
    # commit waited for while they move; an operation asked again backed off, RFC 6298 §5.5).
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    # The gates job's limit.
    timeout-minutes: 124
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --all-features --locked --no-run --test cluster --test kill
        shell: bash
      # The deadline: the limit less the build (up to 15 min on windows-11-arm), the checkout and
      # toolchain, and the slowest round with room.
      - run: |
          deadline=$((SECONDS + 90 * 60))
          i=0
          fails=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            i=$((i + 1))
            for scenario in stalled-devices member-stopped; do
              start=$SECONDS
              if [ "$scenario" = stalled-devices ]; then
                cargo test -p hyper-raft-e2e --all-features --locked --test cluster -- stalled-devices > run.log 2>&1
              else
                cargo test -p hyper-durable-e2e --all-features --locked --test kill -- member-stopped > run.log 2>&1
              fi
              status=$?
              echo "round $i $scenario exit $status in $((SECONDS - start)) s"
              grep -E "^(ok |[a-z-]+: ok)" run.log | cut -c1-600
              if [ "$status" -ne 0 ]; then
                fails=$((fails + 1))
                tail -80 run.log
              fi
            done
            if [ "$fails" -gt 0 ]; then break; fi
          done
          echo "SOAK rounds $i failures $fails"
          [ "$fails" -eq 0 ]
        shell: bash
