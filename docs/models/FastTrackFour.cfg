\* FastTrackAnyRound.cfg with the round of a vote counted, as the core
\* counts it: four voters, of whom three are a fast quorum, over three
\* terms. Every state holds what that configuration breaks.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3, s4}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 3
  MaxLen = 1
  Rule = "most"
  HeldAt = {1}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 3602968
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
