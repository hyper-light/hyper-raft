name: ci

on:
  push:

jobs:
  stall-loop:
    # Diagnostic only, never merged. windows-11-arm's access violation (runs 37184084685 and
    # 37204898614: a member of hyper-durable-e2e's kill test, in a stall case, writes to 0x10e from
    # Node::drain) caught with the fault report's registers and code bytes. The two stall cases
    # run until one fails or the deadline passes; windows-2025 runs the same loop beside it, so a
    # run says whether the fault is aarch64's alone.
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2025
    runs-on: ${{ matrix.runner }}
    # The gates job's limit.
    timeout-minutes: 64
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test -p hyper-durable-e2e --test kill --locked --no-run
        shell: bash
      # The deadline: the limit less the test build (3 min 3 s on windows-11-arm in run
      # 37204898614), the checkout and toolchain, and a stall pair's longest run with room.
      - run: |
          deadline=$((SECONDS + 55 * 60))
          i=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            i=$((i + 1))
            echo "== iteration $i at ${SECONDS}s"
            if ! cargo test -p hyper-durable-e2e --test kill --locked -- stall-; then
              echo "failed at iteration $i"
              exit 1
            fi
          done
          echo "no failure in $i iterations"
        shell: bash
