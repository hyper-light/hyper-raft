\* Three voters, of which a change adds s4: two terms, two indexes, one
\* value beside the leader's own. After the change the fast quorum is three
\* of the four that are also the three of before (FastTrackGrowReached.cfg
\* shows that an index is so committed), and what was committed every
\* later leader holds.
SPECIFICATION Spec
