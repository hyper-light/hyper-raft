[package]
name = "hyper-block"
description = "Block I/O for the shared log: aligned direct I/O, the platform's full flush, buffers that meet the device's alignment, group commit's wait, a device issuer and a simulated device with power-loss semantics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Test support for other crates: the simulated power-loss file and, on macOS, a disk image
# attached as a device node.
sim = []

[dependencies]
# A kept record's checksum (`record`), the log's CRC-32C.
crc32c.workspace = true
getrandom.workspace = true
hyper-rt = { path = "../hyper-rt" }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Linux's native AIO system calls (`aio`): io_setup, io_submit, io_getevents, io_destroy.
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# The reads bench counts allocator calls and page faults (benches/reads.rs).
hyper-measure = { path = "../hyper-measure" }

[lints]
workspace = true

[[bench]]
name = "reads"
harness = false
