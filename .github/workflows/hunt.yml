name: hunt

# hunt/udp-reset-windows: what Windows does with a UDP socket after an ICMP port unreachable
# (crates/hyper-rt/tests/udp_reset_diag.rs), printed; the gates are not run on this branch.
on:
  push:
    branches: ["hunt/udp-reset-windows-final"]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test -p hyper-rt --locked --test udp_reset_diag --no-run
        shell: bash
      - run: cargo test -p hyper-rt --locked --test udp_reset_diag -- --nocapture --test-threads 1
        shell: bash
      - run: cargo test -p hyper-rt-transport --locked --test reset_e2e_diag --no-run
        shell: bash
      - run: for round in 1 2 3 4 5 6; do echo "ROUND $round reports on"; cargo test -p hyper-rt-transport --locked --test reset_e2e_diag e3_ -- --nocapture --test-threads 1 || exit 1; done
        shell: bash
      - run: for round in 1 2 3 4 5 6; do echo "ROUND $round reports off"; cargo test -p hyper-rt-transport --locked --test reset_e2e_diag e3_ -- --nocapture --test-threads 1 || exit 1; done
        shell: bash
        env:
          HYPER_RT_DIAG_REPORTS_OFF: "1"
