name: hunt

# hunt/console-close: a console close delivered to a child process (crates/hyper-rt/tests/console_close_diag.rs),
# held and not, and how long the OS waits; printed. Every step is bounded so the job ends with its log.
# The gates are not run on this branch.
on:
  push:
    branches: ["hunt/console-close"]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - timeout-minutes: 3
        run: |
          cmd //c ver
          whoami
          query session || true
          reg query "HKCU\Control Panel\Desktop" //v HungAppTimeout || true
          reg query "HKCU\Control Panel\Desktop" //v WaitToKillAppTimeout || true
          reg query "HKLM\SYSTEM\CurrentControlSet\Control" //v WaitToKillServiceTimeout || true
          reg query "HKCU\Console\%%Startup" || true
        shell: bash
      - run: cargo test -p hyper-rt --locked --test console_close_diag --no-run
        shell: bash
      - if: always()
        timeout-minutes: 8
        run: cargo test -p hyper-rt --locked --test console_close_diag p_rounds -- --nocapture --test-threads 1
        shell: bash
      - if: always()
        timeout-minutes: 8
        run: cargo test -p hyper-rt --locked --test console_close_diag w_rounds -- --nocapture --test-threads 1
        shell: bash
      - if: always()
        timeout-minutes: 4
        run: cargo test -p hyper-rt --locked --test console_close_diag p_never -- --nocapture --test-threads 1
        shell: bash
      - if: always()
        timeout-minutes: 4
        run: cargo test -p hyper-rt --locked --test console_close_diag w_never -- --nocapture --test-threads 1
        shell: bash
      - if: always()
        timeout-minutes: 4
        run: cargo test -p hyper-rt --locked --test console_close_diag w_break -- --nocapture --test-threads 1
        shell: bash
