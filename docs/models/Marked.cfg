\* The classic core with marked members (core steps R-5 and R-7): three
\* voters, any of which may lose the tail of its log at rest and reopen
\* marked, three terms, two indexes. A marked voter judges votes by its mark;
\* a marked candidate campaigns on its log without its own vote. What is
\* committed every later leader holds.
