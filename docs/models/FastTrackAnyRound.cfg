\* Four voters, of whom three are a fast quorum, and a member that holds an
\* entry beside its log counts whatever its log holds: the checker must
\* find that a leader then lacks what was committed. One member leads with
\* an entry of its own at the index, a second leader commits another there
\* by the three whose logs are empty, and they elect the first, by their
\* logs, with its own.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3, s4}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 3
  MaxLen = 1
  Rule = "most"
  HeldAt = {1}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "any"
  Configs = "term"
  StateBudget = 315519
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
