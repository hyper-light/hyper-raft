  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 2
  Rule = "most"
  HeldAt = {2}
  Losers = {}
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 5228729
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
