\* The scenario with the counting of logs alone: A counts for its log and
\* holds nothing, the release waiting for the classic commit.
INIT TermOneLogs
NEXT Next
VIEW ScenarioView
CONSTANTS
  Servers = {s1, s2, s3, s4}
  Initial = {s1, s2, s3, s4}
  Target = {s1, s2, s3, s4}
  Joint = FALSE
  Values = {v1, v2}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 3
  MaxLen = 3
  Rule = "most"
  HeldAt = {2, 3}
  Losers = {}
  Releases = "classic"
  Votes = "logs"
  Reports = "held"
  Leads <- ScenarioLeads
  Proposed <- ScenarioProposals
  A = s1
  B = s2
  C = s3
  D = s4
  Early = v1
  Late = v2
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 10000000
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
