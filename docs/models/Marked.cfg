\* The classic core with marked members (core steps R-5 and R-7): three
\* voters, any of which may lose the tail of its log at rest and reopen
\* marked, two terms, two indexes: the fewest at which a marked member's log
\* holds an entry below what it lost, and one is elected in the second term
\* (MarkedReached.cfg). A marked voter judges votes by its mark; a marked
\* candidate campaigns on its log without its own vote. What is committed
\* every later leader holds.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Initial = {s1, s2, s3}
  Target = {s1, s2, s3}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 2
  Rule = "most"
  HeldAt = {}
  Losers = {s1, s2, s3}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 303762
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
