\* FastTrackRestamp.cfg with the claim that no two logs hold an entry of one
\* term at one index above entries of different terms: the checker must find
\* such a pair, or LogMatching's weaker comparison is never put to work.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Initial = {s1, s2, s3}
  Target = {s1, s2, s3}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 3
  Rule = "most"
  HeldAt = {2}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 1230055
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
  NoRestamp
