\* A follower answering for memory with no promise: the checker must find a leader
\* that lacks what was committed. s3 answers for s1's entry with no promise,
\* crashes unmarked and is elected by s2 in term 2; s1 commits on its answer.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 1
  Spanning = 2
  Mutant = "pastpromise"
  StateBudget = 4562
SYMMETRY Symmetry
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  LeaderHolds
