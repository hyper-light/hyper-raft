\* Five voters, and one that is elected takes the entry its voters hold
\* least: the checker must find that a leader then lacks what was committed,
\* by an election whose voters held the committed entry most. The fast
\* quorum is counted without the round of its votes, so that one index
\* shows it.
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3, s4, s5}
  Initial = {s1, s2, s3, s4, s5}
  Target = {s1, s2, s3, s4, s5}
  Joint = FALSE
  Values = {v1, v2}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 1
  Rule = "least"
  HeldAt = {1}
  Losers = {}
  Releases = "classic"
  Votes = "held"
  Reports = "held"
  Leads <- AnyLeads
  Proposed <- AnyProposals
  Marks = "core"
  Counts = "any"
  Configs = "term"
  StateBudget = 264569
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
