\* SuspicionStop.cfg with the claim that no settled group has a remaining
\* voter that suspects its leader. The checker must refuse it, finding one,
\* or Stable there is checked against no wrong suspicion.
SPECIFICATION Spec
CONSTANTS
  Servers = {a, b, c}
  Stopped = {}
  Leaving = {c}
  Announced = TRUE
  Nobody = Nobody
  MaxTerm = 2
  Rule = "core"
  CheckStable = TRUE
  StateBudget = 41988
INVARIANTS
  WithinBudget
  TypeOK
  OneLeader
  Stable
  AskingCanWin
  NoWrongSuspicionSettled
