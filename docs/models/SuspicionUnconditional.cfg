  Servers = {a, b, c}
  Stopped = {c}
  Leaving = {}
  Announced = FALSE
  Nobody = Nobody
  MaxTerm = 2
  Rule = "unconditional"
  CheckStable = TRUE
  StateBudget = 1618
INVARIANTS
  WithinBudget
  TypeOK
  OneLeader
  Stable
  AskingCanWin
