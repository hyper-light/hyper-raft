\* Marked members across a change that adds a voter by one entry: two
\* voters and s3, two terms, two indexes, any member losing the tail of its
\* log at rest. Of two voters a marked one is never elected (the other alone
\* is no quorum); once the change is committed, s1 leading term 1 writes a
\* second entry, loses it, and is elected in term 2 by s2 and s3
\* (MarkedChangeReached.cfg).
SPECIFICATION Spec
CONSTANTS
  Servers = {s1, s2, s3}
  Initial = {s1, s2}
  Target = {s1, s2, s3}
  Joint = FALSE
  Values = {v1}
  Noop = Noop
  Change = Change
  Enter = Enter
  Leave = Leave
  Nothing = Nothing
  Nobody = Nobody
  MaxTerm = 2
  MaxLen = 2
  Rule = "most"
  HeldAt = {}
  Losers = {s1, s2, s3}
  Marks = "core"
  Counts = "round"
  Configs = "term"
  StateBudget = 76173
SYMMETRY Alike
INVARIANTS
  WithinBudget
  TypeOK
  Agreement
  Committed
  LeaderHolds
  OneLeader
  LogMatching
